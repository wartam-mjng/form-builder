<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f6f8;
    margin: 0;
    padding: 24px 12px;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 28px 24px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; color: #1a1a1a; text-align: center; }
  .form-header {
    background: linear-gradient(135deg, #4a6cf7, #1e3fc4);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .form-header h1 { color: #fff; }
  .form-header p.desc { color: #e6ebff; text-align: center; margin: 0; }
  .header-image {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 16px;
    display: block;
  }
  p.desc { color: #555; margin: 0 0 20px; font-size: 14px; }
  label {
    display: block; font-size: 14px; font-weight: 700;
    margin-bottom: 6px; margin-top: 16px; color: #2851e3;
  }
  input[type="text"], input[type="date"], input[type="number"], select, input[type="file"], textarea {
    width: 100%; box-sizing: border-box; padding: 9px 10px;
    border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
  }
  textarea {
    resize: vertical;
    min-height: 90px;
    font-family: inherit;
  }
  .checkbox-group, .scale-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
  }
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
  }
  .checkbox-item input { width: auto; }
  .scale-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: #444;
  }
  .scale-item input { width: auto; }
  .required-mark { color: #d33; margin-left: 3px; }
  button {
    margin-top: 24px; width: 100%; padding: 11px;
    background: #4a6cf7; color: #fff; border: none;
    border-radius: 6px; font-size: 15px; cursor: pointer;
  }
  button:disabled { background: #9aa8f0; cursor: not-allowed; }
  #msg { margin-top: 16px; font-size: 14px; text-align: center; }
  #msg.success { color: #1a7f37; }
  #msg.error { color: #d33; }
  .loading { text-align: center; color: #888; padding: 40px 0; }
  .setup-box input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 9px 10px;
    border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    margin-top: 6px; margin-bottom: 4px;
  }
  .setup-box p.hint { font-size: 12px; color: #777; margin: 4px 0 0; }
  .footer-link {
    text-align: center; margin-top: 18px;
  }
  .footer-link a {
    font-size: 12px; color: #999; text-decoration: underline; cursor: pointer;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="loading">Memuat form...</div>
</div>

<script>
  let currentFields = [];
  let dataBerjenjang = {};
  let API_URL = getStoredApiUrl();

  if (API_URL) {
    loadForm();
  } else {
    showSetupScreen();
  }

  function getStoredApiUrl() {
    const params = new URLSearchParams(window.location.search);
    const fromUrl = params.get('api');
    if (fromUrl) {
      localStorage.setItem('formApiUrl', fromUrl);
      return fromUrl;
    }
    return localStorage.getItem('formApiUrl') || '';
  }

  function showSetupScreen() {
    document.getElementById('card').innerHTML =
      '<div class="setup-box">' +
      '<h1 style="text-align:left;">Pengaturan Awal</h1>' +
      '<p class="desc">Tempel URL Web App Apps Script (berakhiran <code>/exec</code>) untuk menghubungkan form ini ke Google Sheet & Drive.</p>' +
      '<input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/xxxx/exec">' +
      '<p class="hint">URL ini didapat dari Deploy &gt; Web app di Apps Script.</p>' +
      '<button id="saveApiUrlBtn">Simpan &amp; Lanjutkan</button>' +
      '<div id="setupMsg" style="margin-top:10px;font-size:13px;"></div>' +
      '</div>';

    document.getElementById('saveApiUrlBtn').addEventListener('click', function () {
      const val = document.getElementById('apiUrlInput').value.trim();
      const msg = document.getElementById('setupMsg');
      if (!val || val.indexOf('/exec') === -1) {
        msg.style.color = '#d33';
        msg.textContent = 'URL sepertinya belum benar. Pastikan URL berakhiran /exec.';
        return;
      }
      API_URL = val;
      localStorage.setItem('formApiUrl', val);

      // Simpan juga di URL halaman supaya link yang dibagikan sudah otomatis terhubung
      const newUrl = window.location.pathname + '?api=' + encodeURIComponent(val);
      window.history.replaceState({}, '', newUrl);

      loadForm();
    });
  }

  function loadForm() {
    document.getElementById('card').innerHTML = '<div class="loading">Memuat form...</div>';
    fetch(API_URL + '?action=getConfig')
      .then(function (res) { return res.json(); })
      .then(renderForm)
      .catch(function (err) {
        document.getElementById('card').innerHTML =
          '<p style="color:#d33;">Gagal memuat form: ' + err.message + '</p>' +
          '<div class="footer-link"><a id="resetLink">Ubah URL API</a></div>';
        document.getElementById('resetLink').addEventListener('click', resetApiUrl);
      });
  }

  function resetApiUrl() {
    localStorage.removeItem('formApiUrl');
    window.history.replaceState({}, '', window.location.pathname);
    showSetupScreen();
  }

  function renderForm(config) {
    currentFields = config.fields;
    dataBerjenjang = config.dataBerjenjang || {};
    let html = '<div class="form-header">';
    if (config.gambarHeader) {
      html += '<img class="header-image" src="' + escapeHtml(config.gambarHeader) + '" alt="Header">';
    }
    html += '<h1>' + escapeHtml(config.judul) + '</h1>';
    html += '<p class="desc">' + escapeHtml(config.deskripsi) + '</p>';
    html += '</div>';
    html += '<form id="dynamicForm">';

    config.fields.forEach(function (field, idx) {
      const req = field.wajib ? '<span class="required-mark">*</span>' : '';
      html += '<label>' + escapeHtml(field.nama) + req + '</label>';

      if (field.tipe === 'Pilihan') {
        html += '<select name="field_' + idx + '" ' + (field.wajib ? 'required' : '') + '>';
        html += '<option value="">-- Pilih --</option>';
        field.opsi.forEach(function (opt) {
          html += '<option value="' + escapeHtml(opt) + '">' + escapeHtml(opt) + '</option>';
        });
        html += '</select>';
      } else if (field.tipe === 'Pilihan Berjenjang') {
        // Awalnya kosong/disabled, menunggu field induk dipilih
        html += '<select name="field_' + idx + '" data-bergantung="' + escapeHtml(field.bergantungPada) + '" disabled ' + (field.wajib ? 'required' : '') + '>';
        html += '<option value="">-- Pilih ' + escapeHtml(field.bergantungPada) + ' dulu --</option>';
        html += '</select>';
      } else if (field.tipe === 'Upload File') {
        html += '<input type="file" name="field_' + idx + '" ' + (field.wajib ? 'required' : '') + '>';
      } else if (field.tipe === 'Teks Panjang') {
        html += '<textarea name="field_' + idx + '" rows="5" ' + (field.wajib ? 'required' : '') + '></textarea>';
      } else if (field.tipe === 'Tanggal') {
        html += '<input type="date" name="field_' + idx + '" ' + (field.wajib ? 'required' : '') + '>';
      } else if (field.tipe === 'Angka') {
        html += '<input type="number" name="field_' + idx + '" ' + (field.wajib ? 'required' : '') + '>';
      } else if (field.tipe === 'Checkbox (Pilihan Ganda)') {
        html += '<div class="checkbox-group" data-checkbox-group="field_' + idx + '">';
        field.opsi.forEach(function (opt, optIdx) {
          html += '<label class="checkbox-item">';
          html += '<input type="checkbox" name="field_' + idx + '_opt_' + optIdx + '" value="' + escapeHtml(opt) + '">';
          html += escapeHtml(opt) + '</label>';
        });
        html += '</div>';
      } else if (field.tipe === 'Skala/Rating') {
        html += '<div class="scale-group">';
        field.opsi.forEach(function (opt) {
          html += '<label class="scale-item">';
          html += '<input type="radio" name="field_' + idx + '" value="' + escapeHtml(opt) + '" ' + (field.wajib ? 'required' : '') + '>';
          html += escapeHtml(opt) + '</label>';
        });
        html += '</div>';
      } else {
        html += '<input type="text" name="field_' + idx + '" ' + (field.wajib ? 'required' : '') + '>';
      }
    });

    html += '<button type="submit" id="submitBtn">Kirim</button>';
    html += '<div id="msg"></div>';
    html += '</form>';
    html += '<div class="footer-link"><a id="resetLink">Ubah URL API</a></div>';

    document.getElementById('card').innerHTML = html;
    document.getElementById('dynamicForm').addEventListener('submit', handleSubmit);
    document.getElementById('resetLink').addEventListener('click', resetApiUrl);
    attachCascadingListeners();
  }

  // Hubungkan setiap field "Pilihan Berjenjang" ke field induknya
  function attachCascadingListeners() {
    const form = document.getElementById('dynamicForm');

    currentFields.forEach(function (field, idx) {
      if (field.tipe !== 'Pilihan Berjenjang') return;

      const childSelect = form.querySelector('[name="field_' + idx + '"]');
      const parentIdx = currentFields.findIndex(function (f) { return f.nama === field.bergantungPada; });
      if (parentIdx === -1) return;

      const parentEl = form.querySelector('[name="field_' + parentIdx + '"]');
      if (!parentEl) return;

      parentEl.addEventListener('change', function () {
        const key = field.bergantungPada + '||' + parentEl.value;
        const options = dataBerjenjang[key] || [];
        childSelect.innerHTML = '<option value="">-- Pilih ' + escapeHtml(field.nama) + ' --</option>';
        options.forEach(function (opt) {
          const optEl = document.createElement('option');
          optEl.value = opt;
          optEl.textContent = opt;
          childSelect.appendChild(optEl);
        });
        childSelect.disabled = options.length === 0;
      });
    });
  }

  function handleSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    msg.className = '';
    msg.textContent = 'Mengirim...';

    const form = e.target;
    const data = {};
    const fileFields = currentFields.filter(function (f) { return f.tipe === 'Upload File'; });

    currentFields.forEach(function (field, idx) {
      if (field.tipe === 'Upload File') return;

      if (field.tipe === 'Checkbox (Pilihan Ganda)') {
        const checked = form.querySelectorAll('[data-checkbox-group="field_' + idx + '"] input:checked');
        const values = Array.prototype.map.call(checked, function (el) { return el.value; });
        data[field.nama] = values.join(', ');
        return;
      }

      if (field.tipe === 'Skala/Rating') {
        const checkedRadio = form.querySelector('[name="field_' + idx + '"]:checked');
        data[field.nama] = checkedRadio ? checkedRadio.value : '';
        return;
      }

      const el = form.querySelector('[name="field_' + idx + '"]');
      data[field.nama] = el ? el.value : '';
    });

    if (fileFields.length === 0) {
      submitToServer(data, {});
      return;
    }

    const filePromises = fileFields.map(function (field) {
      const idx = currentFields.indexOf(field);
      const el = form.querySelector('[name="field_' + idx + '"]');
      const file = el && el.files[0];
      if (!file) return Promise.resolve(null);

      return new Promise(function (resolve) {
        const reader = new FileReader();
        reader.onload = function () {
          resolve({
            nama: field.nama,
            base64: reader.result,
            mimeType: file.type,
            fileName: file.name
          });
        };
        reader.readAsDataURL(file);
      });
    });

    Promise.all(filePromises).then(function (results) {
      const files = {};
      results.forEach(function (r) {
        if (r) files[r.nama] = { base64: r.base64, mimeType: r.mimeType, fileName: r.fileName };
      });
      submitToServer(data, files);
    });
  }

  function submitToServer(data, files) {
    fetch(API_URL, {
      method: 'POST',
      // text/plain WAJIB dipakai agar tidak memicu preflight CORS
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'submit', data: data, files: files })
    })
      .then(function (res) { return res.json(); })
      .then(function (result) {
        const msg = document.getElementById('msg');
        if (result.status === 'ok') {
          msg.className = 'success';
          msg.textContent = 'Terkirim! Terima kasih.';
          document.getElementById('dynamicForm').reset();
        } else {
          msg.className = 'error';
          msg.textContent = 'Gagal mengirim: ' + (result.message || 'Terjadi kesalahan.');
        }
        document.getElementById('submitBtn').disabled = false;
      })
      .catch(function (err) {
        const msg = document.getElementById('msg');
        msg.className = 'error';
        msg.textContent = 'Gagal mengirim: ' + err.message;
        document.getElementById('submitBtn').disabled = false;
      });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
